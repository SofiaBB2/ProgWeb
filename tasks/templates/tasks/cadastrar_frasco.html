{% extends "tasks/base.html" %}
{% load static %}
{% block content %}

<div class="login-container-principal">
    <div class="rounded-5 login-sub-container-principal" style="max-width: 600px;">
        
        <form class="p-5" id="form-frasco" method="POST" action="{% url 'cadastro_sucesso' %}">
            {% csrf_token %}
            
            <h2 class="text-center mb-5 fw-bold">CADASTRAR FRASCO</h2>
            
            <div class="mb-4">
                <label for="idFrasco" class="form-label">NÚMERO DE IDENTIFICAÇÃO</label>
                <input type="text" class="form-control" id="idFrasco" name="identificacao">
            </div>
            
            <div class="mb-4">
                <label for="volumeTotal" class="form-label">VOLUME TOTAL</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="volumeTotal" name="volume_total" placeholder="Ex.: XX">
                    <span class="input-group-text">L</span>
                </div>
            </div>

            <div class="mb-4">
                <label for="volumeOcupado" class="form-label">VOLUME OCUPADO</label>
                <div class="input-group">
                    <input type="text" class="form-control" id="volumeOcupado" name="volume_ocupado" placeholder="Ex.: XX">
                    <span class="input-group-text">L</span>
                </div>
            </div>
            
            <div id="mensagens-erro" class="text-danger text-center fw-bold mb-3"></div>
            
            <div class="d-flex justify-content-between align-items-center mt-5">
                <button type="reset" class="btn rounded-pill botao-limpar-campos px-4">
                    LIMPAR CAMPOS
                </button>
                <button type="submit" class="btn rounded-pill botao-cadastrar px-5 py-2">
                    CADASTRAR
                </button>
            </div>
        </form>
    </div>
</div>

<script src="{% static 'tasks/validaPreenchimento.js' %}"></script>

{% endblock content %}
