{% if is_paginated %}
<nav aria-label="Paginação">
    <ul class="pagination justify-content-center">
        {% if page_obj.has_previous %}
        <li class="page-item">
            <a class="page-link" href="{% querystring page=1 %}" aria-label="Primeira página">&laquo;</a>
        </li>
        <li class="page-item">
            <a class="page-link" href="{% querystring page=page_obj.previous_page_number %}" aria-label="Página anterior">Anterior</a>
        </li>
        {% endif %}
        {% for page_number in page_obj.paginator.page_range %}
        <li class="page-item{% if page_number == page_obj.number %} active{% endif %}">
            <a class="page-link" href="{% querystring page=page_number %}">{{ page_number }}</a>
        </li>
        {% endfor %}
        {% if page_obj.has_next %}
        <li class="page-item">
            <a class="page-link" href="{% querystring page=page_obj.next_page_number %}" aria-label="Próxima página">Próxima</a>
        </li>
        <li class="page-item">
            <a class="page-link" href="{% querystring page=page_obj.paginator.num_pages %}" aria-label="Última página">&raquo;</a>
        </li>
        {% endif %}
    </ul>
</nav>
{% endif %}
